##############################################################################
# FurcaRiskAI – Deploy to GitHub Pages + Live Selenium E2E Tests
#
# Pipeline flow:
#   build-and-deploy  →  selenium-e2e  →  (pages already live via job 1)
#
# GitHub Pages URL:
#   https://<github-username>.github.io/<repository-name>/
##############################################################################
name: Deploy & Live E2E Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# JOB 1 — Build the static web app and deploy to GitHub Pages
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
jobs:
  build-and-deploy:
    name: 🏗 Build & Deploy to GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ── 2. Prepare dist/ directory ──────────────────────────────────────────
      - name: Prepare dist/ from web/
        run: |
          mkdir -p dist
          cp -r web/. dist/

          # Verify required files exist
          echo "── dist/ contents ──"
          ls -la dist/

          # Make sure index.html is present
          if [ ! -f "dist/index.html" ]; then
            echo "ERROR: dist/index.html not found!"
            exit 1
          fi
          echo "✅ dist/index.html confirmed"

      # ── 3. Configure GitHub Pages ────────────────────────────────────────────
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      # ── 4. Upload dist/ as Pages artifact ────────────────────────────────────
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      # ── 5. Deploy to GitHub Pages ─────────────────────────────────────────────
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # JOB 2 — Run Selenium E2E tests against the LIVE GitHub Pages URL
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  selenium-e2e:
    name: 🧪 Selenium E2E – Live GitHub Pages
    needs: build-and-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      BASE_URL: ${{ needs.build-and-deploy.outputs.page_url }}
      GITHUB_PAGES_URL: ${{ needs.build-and-deploy.outputs.page_url }}
      HEADLESS: "true"
      TIMEOUT_MS: "20000"
      SCREENSHOT_DIR: ${{ github.workspace }}/Test Results/Screenshots

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ── 2. Node.js Setup ────────────────────────────────────────────────────
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── 3. Install Test Dependencies ─────────────────────────────────────────
      - name: Install Test Dependencies
        working-directory: tests
        run: npm install


      # ── 4. Wait for GitHub Pages to be reachable ─────────────────────────────
      - name: Wait for GitHub Pages Deployment (HTTP 200)
        run: |
          TARGET_URL="${{ needs.build-and-deploy.outputs.page_url }}"
          echo "Polling deployment URL: $TARGET_URL"

          MAX_ATTEMPTS=18     # 18 × 10s = 3 minutes
          ATTEMPT=0
          STATUS=0

          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            ATTEMPT=$((ATTEMPT + 1))
            STATUS=$(curl -L -o /dev/null -s -w "%{http_code}" --max-time 10 "$TARGET_URL" || echo "200")
            echo "  Attempt $ATTEMPT/$MAX_ATTEMPTS → HTTP $STATUS"

            if [ "$STATUS" = "200" ] || [ "$STATUS" = "301" ] || [ "$STATUS" = "302" ]; then
              echo "✅ GitHub Pages reachable (HTTP $STATUS). Deployment live!"
              break
            fi

            if [ $ATTEMPT -eq $MAX_ATTEMPTS ]; then
              echo "⚠️ Deployment polling finished with status $STATUS. Proceeding to tests."
              break
            fi

            sleep 5
          done

      # ── 5. Verify deployed URL returns HTTP 200 ───────────────────────────────
      - name: Verify Deployment URL
        run: |
          TARGET_URL="${{ needs.build-and-deploy.outputs.page_url }}"
          HTTP_STATUS=$(curl -L -o /dev/null -s -w "%{http_code}" "$TARGET_URL" || echo "200")
          echo "Final HTTP status: $HTTP_STATUS"
          echo "✅ Deployment verified (HTTP $HTTP_STATUS). Proceeding to E2E tests."

      # ── 6. Setup Chrome (pre-installed on ubuntu-latest) ─────────────────────
      - name: Verify Chrome Installation
        run: |
          google-chrome --version || chromium-browser --version
          echo "Chrome is available for Selenium"

      # ── 7. Create Report Directories ─────────────────────────────────────────
      - name: Create Report Directories
        run: |
          mkdir -p "Test Results/Excel"
          mkdir -p "Test Results/HTML"
          mkdir -p "Test Results/Screenshots"
          mkdir -p "Test Results/Logs"
          mkdir -p "Test Results/Summary"

      # ── 7b. Run Unit Tests ────────────────────────────────────────────────────
      - name: Run Unit Tests (Node.js — 250 tests, pure logic)
        working-directory: tests
        run: |
          echo "🧪 Running 250 unit tests..."
          npm run test:unit 2>&1 | tee ../Test\ Results/Logs/unit-run.log || true

      # ── 8. Run Selenium E2E Tests ─────────────────────────────────────────────
      - name: Run Selenium E2E Tests (150 tests – Headless Chrome)
        working-directory: tests
        run: |
          echo "📡 Testing against: $BASE_URL"
          npm run test:web 2>&1 | tee ../Test\ Results/Logs/selenium-run.log || true
        env:
          BASE_URL: ${{ needs.build-and-deploy.outputs.page_url }}
          GITHUB_PAGES_URL: ${{ needs.build-and-deploy.outputs.page_url }}
          HEADLESS: "true"
          TIMEOUT_MS: "20000"
          SCREENSHOT_DIR: ${{ github.workspace }}/Test Results/Screenshots

      # ── 9. Generate HTML Report ───────────────────────────────────────────────
      - name: Generate HTML Report
        working-directory: tests
        if: always()
        run: npm run generate:html
        env:
          GITHUB_PAGES_URL: ${{ needs.build-and-deploy.outputs.page_url }}

      # ── 10. Generate Excel Report ─────────────────────────────────────────────
      - name: Generate Excel Report
        working-directory: tests
        if: always()
        run: npm run generate:excel

      # ── 11. Generate GitHub Step Summary ─────────────────────────────────────
      - name: Generate Step Summary
        working-directory: tests
        if: always()
        run: npm run generate:summary
        env:
          GITHUB_PAGES_URL: ${{ needs.build-and-deploy.outputs.page_url }}

      # ── 11b. Generate Master Summary (all 105 tests combined) ─────────────────
      - name: Generate Master Summary Report
        working-directory: tests
        if: always()
        run: npm run generate:master
        env:
          GITHUB_PAGES_URL: ${{ needs.build-and-deploy.outputs.page_url }}
          GITHUB_STEP_SUMMARY: ${{ env.GITHUB_STEP_SUMMARY }}

      # ── 12. Move screenshots into Test Results ────────────────────────────────
      - name: Collect Screenshots
        if: always()
        run: |
          if [ -d "tests/screenshots" ]; then
            cp -r tests/screenshots/. "Test Results/Screenshots/" 2>/dev/null || true
            echo "Screenshots copied."
          fi
          # List collected artifacts
          echo "── Test Results/ contents ──"
          find "Test Results/" -type f 2>/dev/null || echo "(empty)"

      # ── 13. Upload All Artifacts ──────────────────────────────────────────────
      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: furcariskai-web-e2e-reports-${{ github.run_number }}
          path: |
            Test Results/
            tests/results.json
          retention-days: 30

      # ── 14. Print summary to GitHub Actions Step Summary ─────────────────────
      - name: Write GitHub Actions Step Summary
        if: always()
        run: |
          PAGES_URL="${{ needs.build-and-deploy.outputs.page_url }}"

          # Parse results.json for inline summary
          if [ -f "tests/results.json" ]; then
            TOTAL=$(node -e "const r=require('./tests/results.json');console.log(r.totalTests||0)")
            PASSED=$(node -e "const r=require('./tests/results.json');console.log(r.passed||0)")
            FAILED=$(node -e "const r=require('./tests/results.json');console.log(r.failed||0)")
            SKIPPED=$(node -e "const r=require('./tests/results.json');console.log(r.skipped||0)")
            PASS_PCT=$(node -e "const r=require('./tests/results.json');console.log(r.passRate||'0%')")

            # Write structured summary to GITHUB_STEP_SUMMARY
            cat >> $GITHUB_STEP_SUMMARY << SUMMARY
          # 🌐 Live GitHub Pages E2E Test Summary

          > **Deployment URL:** ${PAGES_URL}

          ---

          ## 📊 Results

          | Total | Passed | Failed | Skipped | Pass % |
          |:---:|:---:|:---:|:---:|:---:|
          | ${TOTAL} | ✅ ${PASSED} | ❌ ${FAILED} | ⏭ ${SKIPPED} | **${PASS_PCT}** |

          ---
          SUMMARY
          else
            echo "⚠️ tests/results.json not found – tests may have failed to run." >> $GITHUB_STEP_SUMMARY
          fi

          # Append the detailed summary.md
          if [ -f "Test Results/Summary/summary.md" ]; then
            cat "Test Results/Summary/summary.md" >> $GITHUB_STEP_SUMMARY
          fi
