name: Android Appium E2E Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ===========================================================================
  # JOB 1: Appium E2E Tests
  # ===========================================================================
  appium-e2e:
    name: Appium E2E Android Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # ── 2. Java Setup (for Android build) ───────────────────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 3. Node.js Setup ────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tests/appium/package.json

      # ── 4. Android SDK ──────────────────────────────────────────────────────
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ── 5. Cache Gradle ─────────────────────────────────────────────────────
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ── 6. Build APK ────────────────────────────────────────────────────────
      - name: Build Debug APK
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          elif [ -f "app/gradlew" ]; then
            chmod +x app/gradlew
            cd app && ./gradlew assembleDebug --stacktrace
          else
            echo "No gradlew found; using pre-built APK if present"
          fi

      # ── 7. Android Emulator ─────────────────────────────────────────────────
      - name: Start Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        continue-on-error: true
        with:
          api-level: 33
          arch: x86_64
          profile: Nexus 6
          avd-name: furcarisk_emu
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: echo "Emulator started and ready"

      # ── 8. Install Test Dependencies ────────────────────────────────────────
      - name: Install Test Dependencies
        working-directory: tests/appium
        run: npm install

      # ── 9. Start Appium Server ──────────────────────────────────────────────
      - name: Install & Start Appium
        run: |
          npm install -g appium@latest
          appium driver install uiautomator2
          appium --log appium.log --allow-insecure chromedriver_autodownload &
          sleep 15
          echo "Appium server started"

      # ── 10. Install APK on Emulator ─────────────────────────────────────────
      - name: Install APK on Emulator
        run: |
          APK_PATH=$(find . -name "app-debug.apk" -type f | head -1)
          if [ -n "$APK_PATH" ]; then
            adb install -r "$APK_PATH"
            echo "APK installed: $APK_PATH"
          else
            echo "WARNING: No APK found, skipping install"
          fi

      # ── 11. Run Appium E2E Tests ─────────────────────────────────────────────
      - name: Run Appium E2E Tests
        working-directory: tests/appium
        run: |
          npm run test || true

      # ── 12. Generate HTML Report ─────────────────────────────────────────────
      - name: Generate HTML Report
        working-directory: tests/appium
        if: always()
        run: npm run report:html

      # ── 13. Generate Excel Report ────────────────────────────────────────────
      - name: Generate Excel Report
        working-directory: tests/appium
        if: always()
        run: npm run report:excel

      # ── 14. Write GitHub Step Summary ────────────────────────────────────────
      - name: Add Summary to GitHub Actions
        if: always()
        run: |
          if [ -f "Test Results/Summary/mobile-summary.md" ]; then
            cat "Test Results/Summary/mobile-summary.md" >> $GITHUB_STEP_SUMMARY
          fi

      # ── 15. Upload All Artifacts ─────────────────────────────────────────────
      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: furcariskai-e2e-reports-${{ github.run_number }}
          path: |
            Test Results/
            tests/appium/appium-results.json
            tests/appium/screenshots/
            appium.log
          retention-days: 30

      # ── 16. Prepare GitHub Pages publish directory ───────────────────────────
      - name: Prepare GitHub Pages Directory
        if: always()
        run: |
          mkdir -p gh-pages-publish/reports/latest/screenshots
          mkdir -p gh-pages-publish/reports/history/${{ github.run_number }}

          # Copy HTML report to latest/
          cp "Test Results/HTML/mobile-execution-report.html" gh-pages-publish/reports/latest/
          cp "Test Results/Summary/mobile-summary.md" gh-pages-publish/reports/latest/

          # Copy screenshots if any
          if [ -d "tests/appium/screenshots" ]; then
            cp -r tests/appium/screenshots/. gh-pages-publish/reports/latest/screenshots/
          fi

          # Copy to history/<build-number>/
          cp "Test Results/HTML/mobile-execution-report.html" gh-pages-publish/reports/history/${{ github.run_number }}/

          # Generate index.html for gh-pages root
          cat > gh-pages-publish/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta http-equiv="refresh" content="0; url=reports/latest/execution-report.html">
            <title>FurcaRiskAI Test Reports</title>
          </head>
          <body>
            <p>Redirecting to latest report...</p>
            <a href="reports/latest/execution-report.html">Click here if not redirected</a>
          </body>
          </html>
          EOF

          # Generate reports index
          cat > gh-pages-publish/reports/index.html << 'EOFI'
          <!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="UTF-8">
          <title>FurcaRiskAI - Test Reports Index</title>
          <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
          <style>*{margin:0;padding:0;box-sizing:border-box}body{background:#030712;color:#f8fafc;font-family:Inter,sans-serif;padding:2rem}h1{font-family:Outfit,sans-serif;color:#00f0ff;margin-bottom:1rem}a{color:#00f5d4;text-decoration:none}a:hover{text-decoration:underline}.latest{background:rgba(0,240,255,.08);border:1px solid rgba(0,240,255,.2);border-radius:12px;padding:1.5rem;margin-bottom:1.5rem}</style>
          </head>
          <body>
          <h1>FurcaRiskAI E2E Test Reports</h1>
          <div class="latest">
          <p><strong>Latest Report:</strong> <a href="latest/execution-report.html">View Latest Execution Report</a></p>
          <p style="margin-top:.5rem;color:#94a3b8;font-size:.875rem">Build #${{ github.run_number }} - ${{ github.event.head_commit.message }}</p>
          </div>
          <p><a href="history/${{ github.run_number }}/execution-report.html">Build #${{ github.run_number }} Report</a></p>
          </body>
          </html>
          EOFI

      # ── 17. Upload GitHub Pages Artifact ────────────────────────────────────
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: gh-pages-publish/

  # ===========================================================================
  # JOB 2: Publish to GitHub Pages
  # ===========================================================================
  deploy-pages:
    name: Publish Reports to GitHub Pages
    needs: appium-e2e
    runs-on: ubuntu-latest
    if: always()
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

